        CMD ["pnpm", "--filter", "@repo/worker-service", "exec", "node", "--import", "tsx", "--env-file=/app/.env.shared", "dist/index.js"]
    labels:
      - "coolify.name=funstakes-backend-worker"
    networks:
      - coolify

  # --- Admin Service ---
  admin:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/rowyio/nixpacks:latest
        COPY . /app
        WORKDIR /app/backend-coolify
        RUN pnpm install && pnpm --filter @repo/admin-service build
        CMD ["pnpm", "--filter", "@repo/admin-service", "exec", "node", "--import", "tsx", "--env-file=/app/.env.shared", "dist/index.js"]
    labels:
      - "coolify.name=funstakes-backend-admin"
    networks:
      - coolify

networks:
  coolify:
    external: true
