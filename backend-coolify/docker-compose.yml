services:
  # --- Account Service ---
  account:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/rowyio/nixpacks:latest
        COPY . /app
        WORKDIR /app/backend-coolify
        # Matching your Gateway: No corepack, just straight pnpm
        RUN pnpm install && pnpm --filter @repo/account-service build
        CMD ["pnpm", "--filter", "@repo/account-service", "exec", "node", "--import", "tsx", "--env-file=/app/.env.shared", "dist/index.js"]
    labels:
      - "coolify.name=funstakes-backend-account"
    networks:
      - coolify

  # --- Post Service ---
  post:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/rowyio/nixpacks:latest
        COPY . /app
        WORKDIR /app/backend-coolify
