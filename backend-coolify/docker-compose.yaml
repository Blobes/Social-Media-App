        CMD ["pnpm", "--filter", "@repo/account-service", "exec", "node", "--import", "tsx", "--env-file=/app/.env.shared", "dist/index.js"]
    environment:
      - ACCOUNT_PORT=8080
      - NIXPACKS_APP_DIRECTORY=backend-coolify/apps/account-service
      - GOOGLE_APPLICATION_CREDENTIALS={{project.GOOGLE_APPLICATION_CREDENTIALS}}
      - NIXPACKS_IGNORE={{project.NIXPACKS_IGNORE}}
      - NIXPACKS_NODE_VERSION={{project.NIXPACKS_NODE_VERSION}}
    labels:
      - "coolify.name=funstakes-backend-account"
    networks:
      - coolify

