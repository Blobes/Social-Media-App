        CMD ["pnpm", "--filter", "@repo/post-service", "exec", "node", "--import", "tsx", "--env-file=/app/.env.shared", "dist/index.js"]
    environment:
      - POST_PORT=8081
      - NIXPACKS_APP_DIRECTORY=backend-coolify/apps/post-service
      - GOOGLE_APPLICATION_CREDENTIALS={{project.GOOGLE_APPLICATION_CREDENTIALS}}
      - NIXPACKS_IGNORE={{project.NIXPACKS_IGNORE}}
