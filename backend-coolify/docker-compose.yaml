services:
  # --- Gateway Service ---
  gateway-service:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-alpine
        RUN apk add --no-cache libc6-compat curl
        WORKDIR /app/backend-coolify
        RUN corepack enable && corepack prepare pnpm@latest --activate
        COPY . /app
        RUN pnpm install && pnpm --filter @repo/gateway build
        # Using pnpm exec because tsx is a devDependency
        CMD ["pnpm", "--filter", "@repo/gateway", "exec", "node", "--import", "tsx", "--env-file=/app/.env.shared", "dist/index.js"]
    volumes:
      # Format: [Host Path]:[Container Path]:[Mode]
      - /data/funstakes/.env.shared:/app/.env.shared:ro
    environment:
      - GATEWAY_PORT=8000
      - GATEWAY_URL={{project.BACKEND_URL}}
      - GOOGLE_APPLICATION_CREDENTIALS={{project.GOOGLE_APPLICATION_CREDENTIALS}}
    labels:
      - "coolify.name=funstakes-backend-gateway"
      - "coolify.exposed_port=8000"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

