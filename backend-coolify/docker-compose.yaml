services:
  # --- Gateway Service ---
  gateway:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/railwayapp/nixpacks:latest
        COPY . /app
        WORKDIR /app/backend-coolify
        RUN pnpm install && pnpm --filter @repo/gateway build
        CMD ["pnpm", "--filter", "@repo/gateway", "exec", "node", "--import", "tsx", "--env-file=/app/.env.shared", "dist/index.js"]
    environment:
      - GATEWAY_PORT=8000
      - GATEWAY_URL={{project.BACKEND_URL}}
      - NIXPACKS_APP_DIRECTORY=backend-coolify/apps/gateway
      - GOOGLE_APPLICATION_CREDENTIALS={{project.GOOGLE_APPLICATION_CREDENTIALS}}
      - NIXPACKS_IGNORE={{project.NIXPACKS_IGNORE}}
      - NIXPACKS_NODE_VERSION={{project.NIXPACKS_NODE_VERSION}}
    labels:
      - "coolify.name=funstakes-backend-gateway"
      - "coolify.exposed_port=8000"
    networks:
      - coolify

  # --- Account Service ---
  account:
