version: "3.9"

services:
  gateway-service:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
    volumes:
      - /data/funstakes/secrets/.env.gateway:/app/.env:ro
    environment:
      NODE_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
    labels:
      - "coolify.name=funstakes-backend-gateway"
      - "traefik.enable=true"
      - "traefik.http.routers.gateway-router.rule=Host(`api.funstakes.net`)"
      - "traefik.http.routers.gateway-router.entrypoints=https"
      - "traefik.http.routers.gateway-router.tls=true"
      - "traefik.http.services.gateway-service.loadbalancer.server.port=8000"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  account-service:
    build:
      context: .
      dockerfile: ./apps/account-service/Dockerfile
    volumes:
      - /data/funstakes/secrets/.env.account:/app/.env:ro
    environment:
      NODE_ENV: production
    networks:
      - coolify

  post-service:
    build:
      context: .
      dockerfile: ./apps/post-service/Dockerfile
    volumes:
      - /data/funstakes/secrets/.env.post:/app/.env:ro
    environment:
      NODE_ENV: production
    networks:
      - coolify

  worker-service:
    build:
      context: .
      dockerfile: ./apps/worker-service/Dockerfile
    volumes:
      - /data/funstakes/secrets/.env.worker:/app/.env:ro
    environment:
      NODE_ENV: production
    networks:
      - coolify

  admin-service:
    build:
      context: .
      dockerfile: ./apps/admin-service/Dockerfile
    env_file:
      - /data/funstakes/secrets/.env.gateway
    volumes:
      - /data/funstakes/secrets/.env.admin:/app/.env:ro
    environment:
      NODE_ENV: production
    networks:
      - coolify

networks:
  coolify:
    external: true
