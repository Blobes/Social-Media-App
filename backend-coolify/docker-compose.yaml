services:
  # --- Gateway Service ---
  gateway:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-alpine
        RUN apk add --no-cache libc6-compat
        WORKDIR /app/backend-coolify

        RUN corepack enable && corepack prepare pnpm@latest --activate
        COPY . /app
        RUN pnpm install && pnpm --filter @repo/gateway build
        # Using pnpm exec because tsx is a devDependency
        CMD ["pnpm", "--filter", "@repo/gateway", "exec", "node", "--import", "tsx", "--env-file=/app/.env.shared", "apps/gateway/dist/index.js"]
    environment:
      - GATEWAY_PORT=8000
      - GATEWAY_URL={{project.BACKEND_URL}}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    labels:
      - "coolify.name=funstakes-backend-gateway"
      - "coolify.exposed_port=8000"
    networks:
      - coolify

