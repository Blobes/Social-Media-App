name: fs-v2 CI

on:
  pull_request:
    # Only listen to the v2 branch
    branches:
      - fs-v2
    # Only trigger if files in your monorepo folders change
    paths:
      - "backend/**"
      - "frontend/**"
      - "libs/**"

jobs:
  fs-v2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm install
      # This specifically protects your Lite Federation
      - run: npm run build
