name: v2 Pre-merge Workflow

on:
  pull_request:
    # Only listen to the v2 branch and nothing else
    branches:
      - v2-main
    # Only trigger if files in your monorepo folders change
    paths:
      - "backend/**"
      - "frontend/**"

jobs:
  v2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend/package.json
            frontend/package-lock.json
            backend/package.json
            backend/package-lock.json
      - run: npm install
      - run: npm run build
