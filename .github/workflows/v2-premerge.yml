# This workflow is our main line of defense. It validates the entire V2 Monorepo and Frontend
# build paths before we allow a merge into the main branch, keeping the FunStakes deployment stable.

name: v2 Pre-merge Workflow

on:
  pull_request:
    branches:
      - v2-main
    paths:
      - "backend-v2/**"
      - "frontend/**"

jobs:
  v2-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.3.0 --activate

      - name: Setup Node & Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Updated to match your Render config
          cache: "pnpm"
          # Cache based on both locks to ensure consistency
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend-v2/pnpm-lock.yaml

      - name: Install Dependencies
        run: |
          # Install Frontend
          cd frontend && pnpm install --frozen-lockfile && cd ..
          # Install Backend Monorepo
          cd backend-v2 && pnpm install --frozen-lockfile

      - name: Build Frontend
        env:
          NEXT_PUBLIC_API_URL: https://funstakes.onrender.com
          NEXT_PUBLIC_VERCEL_MICROFRONTENDS_CONFIG: '{"apps":{}}'
        run: |
          cd frontend
          pnpm run build

      - name: Build Backend Monorepo
        run: |
          cd backend-v2
          # We use the filter to ensure shared packages are built first
          pnpm build --filter "@repo/*"
