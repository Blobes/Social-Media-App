name: v2 Pre-merge Workflow

on:
  pull_request:
    branches:
      - v2-main
    paths:
      - "backend/**"
      - "frontend/**"

jobs:
  v2-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        # corepack is built into Node and avoids the blocked third-party action
        run: corepack enable && corepack prepare pnpm@10.3.0 --activate

      - name: Setup Node & Cache pnpm (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: |
            frontend/package.json
            frontend/pnpm-lock.yaml

      - name: Install Frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Setup npm Cache (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            backend/package.json
            backend/package-lock.json

      - name: Install Backend
        run: |
          cd backend
          npm ci

      - name: Build All
        run: npm run build
