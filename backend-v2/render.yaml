services:
  # --- Auth Service ---
  - type: web
    name: funstakes-auth
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm build --filter @repo/auth-service
    startCommand: pnpm --filter @repo/auth-service start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8080"
      - key: COMMON_SECRETS
        fromGroup: funstakes-common-secrets
      - key: COMMS_SECRETS
        fromGroup: funstakes-communication-secrets

  # --- Post Service ---
  - type: web
    name: funstakes-post
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm build --filter @repo/post-service
    startCommand: pnpm --filter @repo/post-service start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8081"
      - key: COMMON_SECRETS
        fromGroup: funstakes-common-secrets

  # --- User Service ---
  - type: web
    name: funstakes-user
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm build --filter @repo/user-service
    startCommand: pnpm --filter @repo/user-service start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8082"
      - key: COMMON_SECRETS
        fromGroup: funstakes-common-secrets

  # --- Worker Service ---
  - type: web
    name: funstakes-worker
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm build --filter @repo/worker-service
    startCommand: pnpm --filter @repo/worker-service start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8083"
      - key: COMMON_SECRETS
        fromGroup: funstakes-common-secrets
      - key: COMMS_SECRETS
        fromGroup: funstakes-communication-secrets

  # --- Admin Service ---
  - type: web
    name: funstakes-admin
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm build --filter @repo/admin-service
    startCommand: pnpm --filter @repo/admin-service start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8084"
      - key: COMMON_SECRETS
        fromGroup: funstakes-common-secrets
