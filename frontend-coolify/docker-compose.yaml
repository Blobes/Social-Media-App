version: "3.9"

services:
  # =========================
  # 🧠 SHELL APP (Main Entry)
  # =========================
  shell-app:
    build:
      context: .
      dockerfile: ./apps/shell/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_URL: http://auth-app:3002
      POST_URL: http://post-app:3003
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    expose:
      - "3000"
    depends_on:
      - auth-app
      - post-app
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shell.rule=Host(`funstakes.net`) || Host(`www.funstakes.net`)"
      - "traefik.http.routers.shell.entrypoints=https"
      - "traefik.http.routers.shell.tls=true"
      - "coolify.exposed_port=3000"

  # =========================
  # 🔐 AUTH APP
  # =========================
  auth-app:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    expose:
      - "3002"
    networks:
      - coolify

  # =========================
  # 📝 POST APP
  # =========================
  post-app:
    build:
      context: .
      dockerfile: ./apps/post/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NODE_ENV: production
      PORT: 3003
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    expose:
      - "3003"
    networks:
      - coolify

networks:
  coolify:
    external: true
