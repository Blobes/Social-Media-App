services:
  # --- API Gateway (The "Front Door") ---
  - type: web
    name: funstakes-gateway
    env: node
    plan: free
    rootDir: backend-v2
    buildCommand: corepack enable && pnpm install && pnpm --filter @repo/gateway build
    startCommand: pnpm --filter @repo/gateway start
    domains:
      - api.funstakes.net
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8000"
      - fromGroup: funstakes-common-secrets
      # --- Automatic Internal Service Discovery ---
      - key: AUTH_SERVICE_URL
        value: "srv-d6s7st24d50c73bj1310:8080"
      - key: POST_SERVICE_URL
        fromService:
          name: funstakes-post
          type: web
          property: hostport
      - key: USER_SERVICE_URL
        fromService:
          name: funstakes-user
          type: web
          property: hostport
      - key: WORKER_SERVICE_URL
        fromService:
          name: funstakes-worker
          type: web
          property: hostport
      - key: ADMIN_SERVICE_URL
        fromService:
          name: funstakes-admin
          type: web
          property: hostport

  # --- Auth Service ---
  - type: web
    name: funstakes-auth
    env: node
    plan: free
    rootDir: backend-v2
    buildCommand: corepack enable && pnpm install
    startCommand: pnpm --filter @repo/auth-service start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8080"
      - fromGroup: funstakes-common-secrets
      - fromGroup: funstakes-communication-secrets

  # --- Post Service ---
  - type: web
    name: funstakes-post
    env: node
    plan: free
    rootDir: backend-v2
    buildCommand: corepack enable && pnpm install
    startCommand: pnpm --filter @repo/post-service start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8081"
      - fromGroup: funstakes-common-secrets

  # --- User Service ---
  - type: web
    name: funstakes-user
    env: node
    plan: free
    rootDir: backend-v2
    buildCommand: corepack enable && pnpm install
    startCommand: pnpm --filter @repo/user-service start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8082"
      - fromGroup: funstakes-common-secrets

  # --- Worker Service ---
  - type: web
    name: funstakes-worker
    env: node
    plan: free
    rootDir: backend-v2
    buildCommand: corepack enable && pnpm install
    startCommand: pnpm --filter @repo/worker-service start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8083"
      - fromGroup: funstakes-common-secrets
      - fromGroup: funstakes-communication-secrets

  # --- Admin Service ---
  - type: web
    name: funstakes-admin
    env: node
    plan: free
    rootDir: backend-v2
    buildCommand: corepack enable && pnpm install
    startCommand: pnpm --filter @repo/admin-service start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "8084"
      - fromGroup: funstakes-common-secrets
