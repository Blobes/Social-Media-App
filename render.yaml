services:
  # --- API Gateway (The "Front Door") ---
  - type: web
    name: funstakes-gateway
    env: node
    plan: free
    rootDir: backend-v2
    buildCommand: corepack enable && pnpm install && pnpm --filter @repo/gateway build
    startCommand: pnpm --filter @repo/gateway start
    domains:
      - api.funstakes.net
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GATEWAY_PORT
        value: "8000"
      - fromGroup: funstakes-common-secrets

  # --- Account Service ---
  - type: web
    name: funstakes-account
    env: node
    plan: free
    rootDir: backend-v2
    buildCommand: corepack enable && pnpm install
    startCommand: pnpm --filter @repo/account-service start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ACCOUNT_PORT
        value: "8080"
      - fromGroup: funstakes-common-secrets
      - fromGroup: funstakes-communication-secrets

  # --- Post Service ---
  - type: web
    name: funstakes-post
    env: node
    plan: free
    rootDir: backend-v2
    buildCommand: corepack enable && pnpm install
    startCommand: pnpm --filter @repo/post-service start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: POST_PORT
        value: "8081"
      - fromGroup: funstakes-common-secrets

  # --- Worker Service ---
  - type: web
    name: funstakes-worker
    env: node
    plan: free
    rootDir: backend-v2
    buildCommand: corepack enable && pnpm install
    startCommand: pnpm --filter @repo/worker-service start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WORKER_PORT
        value: "8083"
      - fromGroup: funstakes-common-secrets
      - fromGroup: funstakes-communication-secrets

  # --- Admin Service ---
  - type: web
    name: funstakes-admin
    env: node
    plan: free
    rootDir: backend-v2
    buildCommand: corepack enable && pnpm install
    startCommand: pnpm --filter @repo/admin-service start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PORT
        value: "8084"
      - fromGroup: funstakes-common-secrets
